<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split chat experiment</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" defer></script>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input { box-sizing: border-box; padding: .5rem; width: 100%; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    #chat-box { border: 1px solid #aaa; height: 15rem; overflow-y: auto; padding: .5rem; }
    #chat-box div { overflow-wrap: anywhere; white-space: pre-wrap; }
    .warning { background: #fff3cd; color: #332701; padding: .75rem; }
    .error { color: #a00000; }
  </style>
</head>
<body>
  <h1>Split chat experiment</h1>
  <p class="warning">Demo only: login does not secure chat. Anyone with backend access can read, send, or impersonate messages. Do not share private information.</p>

  <section id="login-view">
    <h2>Demo login</h2>
    <p>Demo accounts: <strong>player1 / pass1</strong> and <strong>player2 / pass2</strong>.</p>
    <form id="login-form">
      <label for="backend-url">Backend URL</label>
      <input id="backend-url" type="url" value="http://127.0.0.1:5000" required>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Enter chat</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
  </section>

  <section id="chat-view" hidden>
    <h2>Shared chat: <span id="current-user"></span></h2>
    <p id="connection-status" role="status">Connecting...</p>
    <div id="chat-box" role="log" aria-label="Messages" aria-live="polite"></div>
    <form id="message-form">
      <label for="message-input">Message</label>
      <input id="message-input" maxlength="1000" required disabled>
      <button id="send-button" type="submit" disabled>Send</button>
    </form>
    <p id="message-error" class="error" role="alert"></p>
  </section>

  <script>
    const loginForm = document.getElementById("login-form");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const connectionStatus = document.getElementById("connection-status");
    const messageError = document.getElementById("message-error");
    if (location.protocol === "https:") {
      document.getElementById("backend-url").value = location.origin;
    }
    let socket;
    let loggedInUser;
    let sending = false;

    function updateControls() {
      const disabled = !socket || !socket.connected || sending;
      messageInput.disabled = disabled;
      sendButton.disabled = disabled;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("login-error");
      error.textContent = "";
      if (typeof io !== "function") {
        error.textContent = "Socket.IO client failed to load. Check your internet connection.";
        return;
      }

      let backend;
      try {
        backend = new URL(document.getElementById("backend-url").value);
        if (!["http:", "https:"].includes(backend.protocol) ||
            backend.username || backend.password || backend.pathname !== "/" ||
            backend.search || backend.hash) {
          throw new Error("Backend URL must be an HTTP(S) origin.");
        }
      } catch {
        error.textContent = "Enter a valid backend origin, such as http://127.0.0.1:5000.";
        return;
      }

      const button = loginForm.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch(`${backend.origin}/api/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true",
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await response.json();
        if (!response.ok || data.status !== "success") {
          error.textContent = data.message || `Login failed (${response.status}).`;
          return;
        }
        loggedInUser = data.username;
        document.getElementById("password").value = "";
        document.getElementById("current-user").textContent = loggedInUser;
        document.getElementById("login-view").hidden = true;
        document.getElementById("chat-view").hidden = false;
        connectChat(backend.origin);
      } catch (reason) {
        console.error("Login failed:", reason);
        error.textContent = "Cannot complete login. Check the backend URL, origin settings, and server.";
      } finally {
        button.disabled = false;
      }
    });

    function connectChat(backend) {
      socket = io(backend, { transports: ["websocket"] });
      socket.on("connect", () => {
        connectionStatus.textContent = "Connected.";
        updateControls();
      });
      socket.on("disconnect", () => {
        connectionStatus.textContent = "Disconnected. Reconnecting...";
        updateControls();
      });
      socket.on("connect_error", (reason) => {
        console.error("Chat connection failed:", reason);
        connectionStatus.textContent = "Connection failed. Check the backend, origin settings, and WebSocket support.";
        updateControls();
      });
      socket.on("receive_message", (data) => {
        if (!data || typeof data.user !== "string" || typeof data.text !== "string") {
          console.error("Invalid message received:", data);
          return;
        }
        const box = document.getElementById("chat-box");
        const row = document.createElement("div");
        const sender = document.createElement("strong");
        sender.textContent = `${data.user}: `;
        row.append(sender, document.createTextNode(data.text));
        box.append(row);
        box.scrollTop = box.scrollHeight;
      });
    }

    messageForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket || !socket.connected || sending) return;
      messageError.textContent = "";
      sending = true;
      updateControls();
      socket.timeout(5000).emit("send_message", { user: loggedInUser, text }, (error, result) => {
        sending = false;
        updateControls();
        if (error) {
          messageError.textContent = "Delivery unconfirmed. The message may have been sent; check the chat before retrying.";
        } else if (!result || result.status !== "success") {
          messageError.textContent = result?.message || "Message was not accepted.";
        } else {
          messageInput.value = "";
        }
      });
    });
  </script>
</body>
</html>
