[project]
name = "dnd-campaign-helper"
version = "0.1.0"
description = "Streamlit campaign portal for D&D characters, notes, messages, and initiative"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-socketio>=5.7.2",
    "mongomock>=4.3.0",
    "pydantic>=2.14.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "socketio>=0.2.1",
    "streamlit>=1.46.0",
    "typesafe-sdk>=0.7.5",
]
